# https://github.com/baxpr/fmri-ert-rift
# https://github.com/VUIIS/psychopy-iis
---
procyamlversion: 3.0.0-dev.0
containers:
  - name: psychopy
    path: psychopy-iis_v1.0.1.sif
    source: docker://baxterprogers/psychopy-iis:v1.0.1
  - name: fmri-ert-rift
    path: fmri-ert-rift_v2.0.0.sif
    source: docker://baxterprogers/fmri-ert-rift:v2.0.0
requirements:
  walltime: 0-8
  memory: 16G
jobtemplate: job_template_v3.txt

inputs:

  xnat:

    filters:
      - {type: match, inputs: scan_ert1,fmriprep_ert1/scan_fmri}
      - {type: match, inputs: scan_ert2,fmriprep_ert2/scan_fmri}
      - {type: match, inputs: scan_rift1,fmriprep_rift1/scan_fmri}
      - {type: match, inputs: scan_rift2,fmriprep_rift2/scan_fmri}
      - {type: match, inputs: scan_rift3,fmriprep_rift3/scan_fmri}
      - {type: match, inputs: scan_rift4,fmriprep_rift4/scan_fmri}

    scans:

      - name: scan_ert1
        types: ERT_1
        needs_qc: True
        skip_unusable: True
        resources:
          - {resource: PSYDAT, fmatch: '*.psydat', fdest: ert.psydat}

      - {name: scan_ert2, types: ERT_2, needs_qc: True, skip_unusable: True}

      - name: scan_rift1
        types: RIFT_1
        needs_qc: True
        skip_unusable: True
        resources:
          - {resource: PSYDAT, fmatch: '*.psydat', fdest: rift.psydat}

      - {name: scan_rift2, types: RIFT_2, needs_qc: True, skip_unusable: True}

      - {name: scan_rift3, types: RIFT_3, needs_qc: True, skip_unusable: True}

      - {name: scan_rift4, types: RIFT_4, needs_qc: True, skip_unusable: True}

    assessors:

      - name: fmriprep_ert1
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-ert1}
      - name: fmriprep_ert2
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-ert2}
      - name: fmriprep_rift1
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-rift1}
      - name: fmriprep_rift1
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-rift1}
      - name: fmriprep_rift2
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-rift2}          
      - name: fmriprep_rift3
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-rift3}
      - name: fmriprep_rift4
        proctypes: fmriprep-GRUHN_v24
        resources:
          - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep-rift4}
                    
outputs:
  - pdf: first_level_report_ert.pdf
  - dir: spm_ert
  - {path: spmbatch*, type: FILE, resource: SPM_BATCH}
  - {path: trialtimes*.txt, type: FILE, resource: TRIALTIMES}
  - {path: ert.csv, type: FILE, resource: PSYDAT_CSV}
  - {path: rift.csv, type: FILE, resource: PSYDAT_CSV}

pre:
  type: singularity_exec
  container: psychopy
  args: >-
    bash -c '
    convert-psydat.py --psydat_file /INPUTS/ert.psydat --out_file /OUTPUTS/ert.csv && 
    convert-psydat.py --psydat_file /INPUTS/rift.psydat --out_file /OUTPUTS/rift.csv
    '
    
command: 
  type: singularity_run
  container: fmri-ert-rift
  args: >-
    --fmriprep_ert1_dir /INPUTS/fmriprep-ert1/fmriprepBIDS
    --fmriprep_ert2_dir /INPUTS/fmriprep-ert2/fmriprepBIDS
    --fmriprep_rift1_dir /INPUTS/fmriprep-rift1/fmriprepBIDS
    --fmriprep_rift2_dir /INPUTS/fmriprep-rift2/fmriprepBIDS
    --fmriprep_rift3_dir /INPUTS/fmriprep-rift3/fmriprepBIDS
    --fmriprep_rift4_dir /INPUTS/fmriprep-rift4/fmriprepBIDS
    --ert_psydat_csv /OUTPUTS/ert.csv
    --rift_psydat_csv /OUTPUTS/rift.csv
    --hpf_sec 300
    --fwhm_mm 6
    --out_dir /OUTPUTS

